<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقنا - Souqna</title>

<style>
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b7a43;
    color:white;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.hero{
    padding:40px 20px;
    text-align:center;
}

.hero h1{
    color:#0b7a43;
    font-size:36px;
}

.hero p{
    color:#555;
    font-size:18px;
}

.btn{
    display:inline-block;
    margin-top:25px;
    background:#0b7a43;
    color:white;
    padding:15px 35px;
    border-radius:8px;
    text-decoration:none;
    font-size:18px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    font-size:20px;
}

footer{
    margin-top:40px;
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<header>
سوقنا
</header>

<section class="hero">
<h1>منصة سوقنا للإعلانات المبوبة</h1>

<p>
بيع وشراء السيارات والعقارات والوظائف والإلكترونيات بسهولة.
</p>

<a class="btn" href="#">ابدأ الآن</a>
</section>

<section class="categories">

<div class="card">🚗 سيارات</div>

<div class="card">🏠 عقارات</div>

<div class="card">📱 إلكترونيات</div>

<div class="card">💼 وظائف</div>

<div class="card">🛋 أثاث</div>

<div class="card">🐈 حيوانات</div>

</section>

<footer>
© 2026 Souqna جميع الحقوق محفوظة
</footer>

</body>
</html>
